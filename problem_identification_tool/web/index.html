<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Problem Identification Survey</title>
    <link rel="stylesheet" href="questionnaire.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Problem Identification Survey</h1>
            <p>Help us understand common challenges so we can build better solutions.</p>
            <div class="progress-section" role="group" aria-label="Survey progress">
                <div class="progress-meta">
                    <span id="progressStepLabel">Question 1 of 1</span>
                    <span id="progressPercentLabel" aria-hidden="true">0%</span>
                </div>
                <div class="progress-bar" role="progressbar" aria-valuemin="1" aria-valuemax="1" aria-valuenow="1" id="progressBar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="step-dots" id="stepDots" aria-hidden="true"></div>
            </div>
        </header>

        <main class="question-container">
            <div id="validationBanner" class="validation-banner" role="alert" hidden></div>
            <form id="questionnaireForm" novalidate>
                <!-- Questions loaded by questionnaire.js -->
            </form>

            <div class="button-group">
                <button type="button" id="prevBtn" class="btn btn-secondary" style="display: none;">Previous</button>
                <span class="nav-hint" id="navHint">Press Enter to continue</span>
                <button type="button" id="nextBtn" class="btn btn-primary">Next</button>
            </div>
        </main>
    </div>

    <script src="questionnaire.js"></script>
    <script>
      function notifyHeight() {
        const h = document.body.scrollHeight;
        try {
          parent.postMessage(JSON.stringify({ type: 'survey:height', height: h }), '*');
        } catch (_) {}
      }
      window.addEventListener('load', notifyHeight);
      if (typeof ResizeObserver !== 'undefined') {
        new ResizeObserver(notifyHeight).observe(document.body);
      }
    </script>
</body>
</html>
