<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Embed: Problem Identification Survey</title>
  <style>
    body { margin:0; font-family: Segoe UI, Arial, sans-serif; background:#f6f8fb; }
    .frame { width:100%; border:0; }
    .container { max-width:900px; margin:0 auto; padding:0; }
    .fallback { padding:16px; color:#555; text-align:center; }
  </style>
</head>
<body>
  <div class="container">
    <iframe id="surveyFrame" class="frame" src="index.html" title="Problem Identification Survey"></iframe>
    <div class="fallback">
      If the survey does not load, <a href="index.html" target="_blank" rel="noopener">open it in a new tab</a>.
    </div>
  </div>

  <script>
    (function(){
      const frame = document.getElementById('surveyFrame');
      function setHeight(h){ frame.style.height = Math.max(500, Number(h)||0) + 'px'; }
      // Initial height
      setHeight(900);
      // Listen for postMessage events from the survey to auto-resize
      window.addEventListener('message', (e)=>{
        try {
          const data = typeof e.data === 'string' ? JSON.parse(e.data) : e.data;
          if (data && data.type === 'survey:height') setHeight(data.height);
        } catch(_){}
      });
    })();
  </script>
</body>
</html>
